<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="176" height="54" viewBox="0 0 176 54" role="img" aria-label="Email link"><title>Email link</title><style>@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}.r{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}.f{opacity:0;animation:fade 1s ease-out both}.g{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.7,.2,1) both}.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}.pu{animation:pulse 2.4s ease-in-out infinite}.tw{animation:twinkle 3.5s ease-in-out infinite}.bat{transform-box:fill-box;transform-origin:center;animation:flap .8s ease-in-out infinite}@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.pu,.tw,.bat{animation:none!important;opacity:1!important;transform:none!important}}.r,.f,.g,.p,.pu,.tw{animation:none!important;opacity:1!important;transform:none!important}</style><rect x="0" y="0" width="168" height="54" rx="12" fill="#0f1626" stroke="#e6b325" stroke-opacity=".45"/><circle cx="14" cy="27" r="3" fill="#ffcf3a"/><text x="94" y="26" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="15" fill="#ffcf3a">Email</text><text x="94" y="43" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a9b3c4">contact@</text></svg>